<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noordpool · 90° N — Kerstavond in 3D</title>
  <link rel="stylesheet" href="./style.css" />
  <script>
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      window.onerror = function(msg, url, line, col, err) {
        fetch('/api/log?error=' + encodeURIComponent(msg + ' (' + url + ':' + line + ':' + col + ') ' + (err && err.stack ? err.stack : ''))).catch(() => {});
      };
      window.addEventListener('unhandledrejection', function(e) {
        fetch('/api/log?error=' + encodeURIComponent('Unhandled rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason))).catch(() => {});
      });
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-card">
      <div class="loading-pole-icon"></div>
      <h1>NOORDPOOL · 90° N</h1>
      <p>Kerstavond-scène en procedurele shaders worden opgebouwd…</p>
    </div>
  </div>

  <!-- Minimal HUD -->
  <header id="hud-top">
    <div class="hud-pill hud-instructions">
      <strong>Noordpool · 90° N</strong>
      <span>Sleep: rondkijken · Scroll: zoom · Klik: paal, postbus, cadeaus, boom, deur, sneeuwpop, slee, Kerstman, Kerstvrouw &amp; elfendorp · <em>Dubbelklik: vlieg naar object (Esc = terug)</em></span>
    </div>

    <div class="hud-controls">
      <div class="hud-pill quality-group" role="group" aria-label="Kwaliteit">
        <span class="hud-label">Kwaliteit:</span>
        <button type="button" data-quality="low">Laag</button>
        <button type="button" data-quality="medium">Midden</button>
        <button type="button" data-quality="high" class="active">Hoog</button>
      </div>

      <button type="button" id="btn-fps" class="hud-pill hud-btn" title="Toets F">
        FPS (F)
      </button>

      <span id="fps-counter" class="hud-pill fps-badge" style="display: none;">60 FPS</span>

      <button type="button" id="btn-debug" class="hud-pill hud-btn" title="Toets D: Toon obstakel- en botsingscirkels">
        Obstakels (D)
      </button>

      <button type="button" id="btn-elf-village" class="hud-pill hud-btn" title="Vlieg zacht naar het Elfendorp">
        🧝 Elfendorp
      </button>

      <button type="button" id="btn-audio" class="hud-pill hud-btn active">
        🔊 Geluid: Aan
      </button>
    </div>
  </header>

  <!-- Floating 3D Click Tooltip & Hover Label -->
  <div id="scene-tooltip" role="status" aria-live="polite"></div>
  <div id="hover-tooltip" aria-hidden="true"></div>

  <script type="module" src="./src/main.js?v=v3_mobilefix"></script>
</body>
</html>
